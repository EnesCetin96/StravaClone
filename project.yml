name: StravaClone
options:
  bundleIdPrefix: com.enescetin
  deploymentTarget:
    iOS: "17.0"
targets:
  StravaClone:
    type: application
    platform: iOS
    sources:
      - App
      - Models
      - Services
      - Views
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "We need your location to record your running and cycling routes."
        NSLocationAlwaysAndWhenInUseUsageDescription: "We need your location to keep recording your route while the app is in the background."
        UIBackgroundModes:
          - location
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.enescetin.StravaClone
  StravaCloneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: StravaClone
    settings:
      base:
        SWIFT_VERSION: "5.0"